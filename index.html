<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analizador de datos</title>
<meta name="description" content="Subí una planilla (Excel, CSV, ODS) y obtené análisis, indicadores, dashboard con filtros y reporte. Los datos se procesan en tu navegador.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

<script type="module" src="js/main.js"></script>
</head>
<body>
<a class="skip" href="#content">Saltar al contenido</a>
<header class="top no-print">
  <div class="brand">Analizador de datos</div>
  <nav id="steps" aria-label="Pasos">
    <button data-view="upload">Cargar</button>
    <button data-view="analysis" disabled>Análisis</button>
    <button data-view="proposal" disabled>Propuesta</button>
    <button data-view="dashboard" disabled>Dashboard</button>
  </nav>
</header>
<div id="filebar" class="filebar no-print" hidden></div>
<main id="content" tabindex="-1"></main>
<div id="toast" role="status" aria-live="polite"></div>
</body>
</html>
